<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炎洲集團華苓BPM統計分析 - 上傳</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0066B3;
            --primary-dark: #003D6B;
            --primary-light: #3399CC;
            --accent-gold: #C9A961;
            --bg-gradient-start: #F0F4F8;
            --bg-gradient-end: #E8EDF2;
            --card-bg: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #5A6C7D;
            --border-color: #E0E7EE;
            --shadow-sm: 0 2px 8px rgba(0, 102, 179, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 102, 179, 0.12);
            --shadow-lg: 0 8px 32px rgba(0, 102, 179, 0.16);
            --shadow-xl: 0 12px 48px rgba(0, 102, 179, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Poppins', -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-dark) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section h1 {
            color: #FFFFFF;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .logo-section .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .upload-card {
            background: var(--card-bg);
            padding: 45px 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-xl), 0 0 100px rgba(0, 102, 179, 0.3);
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .upload-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-blue), var(--accent-gold), var(--primary-light));
        }

        .upload-card h2 {
            color: var(--text-primary);
            font-size: 1.8em;
            margin-bottom: 12px;
            text-align: center;
        }

        .upload-card p {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.05em;
        }

        .upload-area {
            border: 3px dashed var(--border-color);
            border-radius: 16px;
            padding: 45px 32px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(0, 102, 179, 0.02) 0%, rgba(201, 169, 97, 0.02) 100%);
        }

        .upload-area:hover {
            border-color: var(--primary-blue);
            background: linear-gradient(135deg, rgba(0, 102, 179, 0.05) 0%, rgba(201, 169, 97, 0.05) 100%);
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: var(--primary-blue);
            background: linear-gradient(135deg, rgba(0, 102, 179, 0.08) 0%, rgba(201, 169, 97, 0.08) 100%);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
            display: block;
        }

        .file-input {
            display: none;
        }

        .upload-text {
            font-size: 1.2em;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .upload-hint {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .file-info {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border-radius: 12px;
            border-left: 5px solid #4CAF50;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .file-info.show {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-info-icon {
            font-size: 2em;
        }

        .file-info-text {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #2E7D32;
            margin-bottom: 4px;
        }

        .file-size {
            color: #558B2F;
            font-size: 0.9em;
        }

        .analyze-button {
            width: 100%;
            padding: 18px;
            margin-top: 30px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            display: none;
        }

        .analyze-button.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .analyze-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .analyze-button:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            margin-top: 30px;
            text-align: center;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(0, 102, 179, 0.1);
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 1.05em;
        }

        .error-message {
            margin-top: 20px;
            padding: 20px;
            background: #ffebee;
            border-left: 5px solid #f44336;
            border-radius: 12px;
            color: #c62828;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .feature-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            color: white;
        }

        .feature-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 0.95em;
            font-weight: 500;
        }

        .history-card {
            background: var(--card-bg);
            margin-top: 24px;
            padding: 28px 32px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.8s ease-out;
        }

        .history-card h3 {
            color: var(--text-primary);
            font-size: 1.25em;
            margin-bottom: 14px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-month {
            font-weight: 700;
            color: var(--primary-blue);
            min-width: 105px;
        }

        .history-meta {
            flex: 1;
            color: var(--text-secondary);
            font-size: 0.88em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item button {
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .history-open {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-light));
            color: white;
        }

        .history-open:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .history-delete {
            background: #fdecea;
            color: #c62828;
        }

        .history-delete:hover {
            background: #f9d0cc;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .logo-section h1 {
                font-size: 1.8em;
            }

            .upload-card {
                padding: 32px 26px;
            }

            .upload-area {
                padding: 32px 20px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-section">
            <h1>📊 炎洲集團華苓BPM統計分析</h1>
            <div class="subtitle">智能數據分析 · 一鍵生成報表</div>
        </div>

        <div class="upload-card">
            <h2>上傳Excel檔案</h2>
            <p>支援 .xlsx / .xls 格式，檔案將在瀏覽器本地處理，確保數據安全</p>

            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <span class="upload-icon">📁</span>
                <div class="upload-text">點擊選擇檔案或拖拽至此</div>
                <div class="upload-hint">請上傳華苓BPM統計Excel檔案</div>
            </div>

            <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls" />

            <div class="file-info" id="fileInfo">
                <span class="file-info-icon">✅</span>
                <div class="file-info-text">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>
            </div>

            <button class="analyze-button" id="analyzeButton">
                🚀 開始分析
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">正在分析數據，請稍候...</div>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="history-card" id="historyCard" style="display: none;">
            <h3>📚 歷史分析報表</h3>
            <div id="historyList"></div>
        </div>

        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">即時處理<br />秒級生成報表</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">本地處理<br />數據安全保密</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📊</div>
                <div class="feature-text">6大維度<br />全方位分析</div>
            </div>
        </div>
    </div>

    <script src="bpm-history.js"></script>
    <script>
        let selectedFile = null;

        // File input handler
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);

        // Drag and drop handlers
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    selectedFile = file;
                    displayFileInfo(file);
                } else {
                    showError('請上傳 .xlsx 或 .xls 格式的檔案');
                }
            }
        });

        // Analyze button handler
        document.getElementById('analyzeButton').addEventListener('click', processFile);

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            selectedFile = file;
            displayFileInfo(file);
        }

        function displayFileInfo(file) {
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('fileInfo').classList.add('show');
            document.getElementById('analyzeButton').classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function processFile() {
            console.log('🚀 ========================================');
            console.log('🚀 開始處理 Excel 文件:', selectedFile ? selectedFile.name : '無');
            console.log('🚀 ========================================');

            if (!selectedFile) {
                showError('請先選擇檔案');
                return;
            }

            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('analyzeButton').style.display = 'none';
            document.getElementById('errorMessage').classList.remove('show');

            // Read file
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    console.log('📖 Excel 文件讀取成功');
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    console.log('📚 工作表數量:', workbook.SheetNames.length);
                    console.log('📚 工作表名稱:', workbook.SheetNames);

                    // Verify workbook has required sheets
                    if (workbook.SheetNames.length < 6) {
                        throw new Error('Excel檔案格式不正確，需包含6個工作表');
                    }

                    // Process all sheets
                    const allData = {
                        monthly: processMonthlySheet(workbook.Sheets[workbook.SheetNames[0]]),
                        company: processCompanySheet(workbook.Sheets[workbook.SheetNames[1]]),
                        signature: processSignatureSheet(workbook.Sheets[workbook.SheetNames[2]]),
                        reject: processRejectSheet(workbook.Sheets[workbook.SheetNames[3]]),
                        managerReject: processManagerRejectSheet(workbook.Sheets[workbook.SheetNames[4]]),
                        approvalTime: processApprovalTimeSheet(workbook.Sheets[workbook.SheetNames[5]])
                    };

                    // 保存調試摘要
                    const debugSummary = {
                        monthlyFormsCount: allData.monthly.data.length,
                        companyCount: allData.company.companies.length,
                        signatureManagersCount: allData.signature.managers.length,
                        rejectApplicantsCount: allData.reject.applicants.length,
                        managerRejectCount: allData.managerReject.managers.length
                    };
                    sessionStorage.setItem('debugSummary', JSON.stringify(debugSummary));

                    // Store data in sessionStorage
                    sessionStorage.setItem('bpmAnalysisData', JSON.stringify(allData));
                    sessionStorage.setItem('uploadedFileName', selectedFile.name);

                    // ========== 數據驗證 ==========
                    const validationErrors = [];
                    const validationWarnings = [];

                    // 驗證月度統計
                    if (!allData.monthly.months || allData.monthly.months.length === 0) {
                        validationErrors.push('月度統計: 月份數據缺失');
                    }
                    if (!allData.monthly.data || allData.monthly.data.length === 0) {
                        validationErrors.push('月度統計: 表單數據缺失');
                    } else if (allData.monthly.data.length < 10) {
                        validationWarnings.push(`月度統計: 表單數量較少 (${allData.monthly.data.length} 個)`);
                    }

                    // 驗證公司別統計
                    if (!allData.company.companies || allData.company.companies.length === 0) {
                        validationErrors.push('公司別統計: 公司數據缺失');
                    }
                    if (!allData.company.data || allData.company.data.length === 0) {
                        validationErrors.push('公司別統計: 表單數據缺失');
                    }

                    // 驗證數據一致性
                    if (allData.monthly.data && allData.company.data) {
                        const monthlyCount = allData.monthly.data.length;
                        const companyCount = allData.company.data.length;
                        const diff = Math.abs(monthlyCount - companyCount);
                        const diffPercent = monthlyCount > 0 ? (diff / monthlyCount) * 100 : 0;
                        if (diffPercent > 30) {
                            validationWarnings.push(`月度統計 (${monthlyCount}) 與公司別統計 (${companyCount}) 表單數量差異較大`);
                        }
                    }

                    console.log('✨ ========================================');
                    console.log('✨ 數據處理完成! 摘要:');
                    console.log('✨ 月度統計表單數:', allData.monthly.data.length, '個');
                    console.log('✨ 公司數量:', allData.company.companies.length, '個');
                    console.log('✨ 簽核主管數:', allData.signature.managers.length, '位');
                    console.log('✨ ========================================');

                    // 顯示驗證結果
                    if (validationErrors.length > 0) {
                        console.error('❌ 數據驗證失敗:', validationErrors);
                        document.getElementById('loading').classList.remove('show');
                        document.getElementById('analyzeButton').style.display = 'block';
                        showError('數據驗證失敗:\n' + validationErrors.join('\n'));
                        return; // 阻止跳轉
                    }

                    if (validationWarnings.length > 0) {
                        console.warn('⚠️ 數據驗證警告:', validationWarnings);
                        validationWarnings.forEach(w => console.warn('⚠️', w));
                    }

                    // 保存本月分析資料至歷史 (localStorage,以報表月份為鍵)
                    const saveResult = bpmSaveHistory(allData, selectedFile.name);
                    if (saveResult.ok) {
                        console.log(`💾 已保存 ${bpmFormatMonth(saveResult.month)} 分析資料至歷史` + (saveResult.trimmed ? ' (已清理最舊月份)' : ''));
                    } else {
                        console.warn('💾 歷史資料保存失敗:', saveResult.reason);
                    }

                    console.log('✨ 即將跳轉到結果頁面...');
                    console.log('✨ ========================================');

                    setTimeout(() => {
                        window.location.href = 'results.html';
                    }, 800);

                } catch (error) {
                    console.error('處理檔案時發生錯誤:', error);
                    showError('檔案處理失敗：' + error.message);
                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('analyzeButton').style.display = 'block';
                }
            };
            reader.readAsArrayBuffer(selectedFile);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
        }

        // Sheet processing functions
        function isMonthToken(value) {
            if (value === null || value === undefined) return false;
            const text = String(value).trim().replace(/\s+/g, '');
            if (!text) return false;
            return (
                /^\d{6}$/.test(text) ||
                /^\d{4}[\/-]\d{1,2}$/.test(text) ||
                /^\d{4}年\d{1,2}月?$/.test(text)
            );
        }

        function cellText(value) {
            return value === null || value === undefined ? '' : String(value).trim();
        }

        function toNum(value) {
            if (value === null || value === undefined || value === '' || value === '-') return 0;
            const n = Number(value);
            return Number.isFinite(n) ? n : 0;
        }

        // 找出月份標題行,並記錄每個月份所在的欄位索引 (自動適應月份起始欄不同的工作表)
        function findMonthColumns(json) {
            const maxScan = Math.min(json.length, 20);
            for (let i = 0; i < maxScan; i++) {
                const row = json[i];
                if (!row) continue;
                const cols = [];
                for (let j = 0; j < row.length; j++) {
                    const text = cellText(row[j]);
                    if (text.includes('總計')) break;
                    if (isMonthToken(row[j])) cols.push({ col: j, month: text.replace(/\s+/g, '') });
                }
                if (cols.length >= 3) {
                    return {
                        headerRowIdx: i,
                        months: cols.map(c => c.month),
                        monthCols: cols.map(c => c.col)
                    };
                }
            }
            return { headerRowIdx: 2, months: [], monthCols: [] };
        }

        function findCompanyHeaderRow(json) {
            const maxScan = Math.min(json.length, 20);
            for (let i = 0; i < maxScan; i++) {
                const row = json[i];
                if (!row) continue;
                const hasTotal = row.some(cell => String(cell || '').includes('總計'));
                if (!hasTotal) continue;
                let nameCount = 0;
                for (let j = 2; j < row.length; j++) {
                    const cell = row[j];
                    const text = cell === null || cell === undefined ? '' : String(cell).trim();
                    if (!text || text === '總計') continue;
                    nameCount++;
                }
                if (nameCount >= 2) return i;
            }
            return 2;
        }

        function processMonthlySheet(sheet) {
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            const { headerRowIdx, months, monthCols } = findMonthColumns(json);
            console.log('📊 [月度統計] 總行數:', json.length, '| 月份:', months);

            // 版面: 第0欄=流程類別(僅每組第一列有值), 第1欄=流程名稱, 月份數據依 monthCols 取值
            const forms = [];
            let currentCategory = '';
            for (let i = headerRowIdx + 1; i < json.length; i++) {
                const row = json[i];
                if (!row) continue;

                const firstCol = cellText(row[0]);
                const secondCol = cellText(row[1]);

                // 遇到"總計"整表結束
                if (firstCol.includes('總計') || secondCol.includes('總計') || firstCol === 'Grand Total') break;
                // 跳過類別合計行 (如"人事類 合計")
                if (firstCol.includes('合計') || secondCol.includes('合計')) continue;
                // 跳過欄位標題行
                if (firstCol.includes('類別') || secondCol.includes('名稱') || secondCol.includes('開立張數')) continue;

                // 類別為合併儲存格,僅每組第一列有值,需向下填充
                if (firstCol) currentCategory = firstCol;
                if (!secondCol) continue;

                const monthlyData = monthCols.map(c => toNum(row[c]));
                forms.push({
                    name: secondCol,
                    category: currentCategory,
                    monthly_data: monthlyData,
                    total: monthlyData.reduce((a, b) => a + b, 0)
                });
            }

            console.log('📊 [月度統計] 解析完成! 共', forms.length, '個表單');
            return { months, data: forms };
        }

        function processCompanySheet(sheet) {
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

            const headerRowIdx = findCompanyHeaderRow(json);
            const headerRow = json[headerRowIdx] || [];

            // 公司名稱從第2欄開始,直到"總計"為止
            const companies = [];
            const companyCols = [];
            for (let j = 2; j < headerRow.length; j++) {
                const text = cellText(headerRow[j]);
                if (!text || text.includes('總計')) break;
                companies.push(text);
                companyCols.push(j);
            }
            console.log('🏢 [公司別統計] 公司:', companies.length, '個:', companies);

            // 版面: 第0欄=流程類別(合併儲存格,向下填充), 第1欄=流程名稱
            const data = [];
            let currentCategory = '';
            for (let i = headerRowIdx + 1; i < json.length; i++) {
                const row = json[i];
                if (!row) continue;

                const firstCol = cellText(row[0]);
                const secondCol = cellText(row[1]);

                if (firstCol.includes('總計') || secondCol.includes('總計') || firstCol === 'Grand Total') break;
                if (firstCol.includes('合計') || secondCol.includes('合計')) continue;
                if (firstCol.includes('類別') || secondCol.includes('名稱') || secondCol.includes('開立張數')) continue;

                if (firstCol) currentCategory = firstCol;
                if (!secondCol) continue;

                const companyData = companyCols.map(c => toNum(row[c]));
                data.push({
                    category: currentCategory,
                    name: secondCol,
                    company_data: companyData,
                    total: companyData.reduce((a, b) => a + b, 0)
                });
            }

            console.log('🏢 [公司別統計] 解析完成! 共', data.length, '個表單');
            return { companies, data };
        }

        function processSignatureSheet(sheet) {
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            const { headerRowIdx, months, monthCols } = findMonthColumns(json);

            // 版面: 主管姓名在月份起始欄的前一欄 (如"00001李志賢"為工號+姓名)
            const nameCol = Math.max(0, (monthCols[0] ?? 1) - 1);

            const signers = [];
            for (let i = headerRowIdx + 1; i < json.length; i++) {
                const row = json[i];
                if (!row) continue;

                const raw = cellText(row[nameCol]);
                if (!raw) continue;
                if (raw.includes('總計') || raw.includes('合計')) break;
                if (raw.includes('姓名') || cellText(row[monthCols[0]]).includes('次數')) continue;

                const m = raw.match(/^(\d+)\s*(.*)$/);
                const monthlyData = monthCols.map(c => toNum(row[c]));
                signers.push({
                    id: m ? m[1] : '',
                    name: m && m[2] ? m[2] : raw,
                    monthly_data: monthlyData,
                    total: monthlyData.reduce((a, b) => a + b, 0)
                });
            }

            console.log('✍️ [簽核次數] 月份:', months, '| 主管:', signers.length, '位');
            return { months, managers: signers };
        }

        // 共用解析: 版面為 第0欄=公司(合併儲存格,向下填充), 第1欄=姓名, 月份數據依 monthCols 取值
        function processCompanyPersonSheet(sheet, label) {
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            const { headerRowIdx, months, monthCols } = findMonthColumns(json);

            const people = [];
            let currentCompany = '';

            for (let i = headerRowIdx + 1; i < json.length; i++) {
                const row = json[i];
                if (!row) continue;

                const firstCol = cellText(row[0]);
                const secondCol = cellText(row[1]);

                // 跳過公司合計行 (如"a.炎洲 合計") 與總計行
                if (firstCol.includes('合計') || firstCol.includes('總計') || secondCol.includes('合計')) continue;
                // 跳過欄位標題行
                if (firstCol === '公司' || secondCol.includes('姓名') || cellText(row[monthCols[0]]).includes('次數')) continue;

                if (firstCol) currentCompany = firstCol;
                if (!secondCol) continue;

                const monthlyData = monthCols.map(c => toNum(row[c]));
                const total = monthlyData.reduce((a, b) => a + b, 0);
                if (total > 0) {
                    people.push({
                        company: currentCompany,
                        name: secondCol,
                        monthly_data: monthlyData,
                        total: total
                    });
                }
            }

            console.log(`${label} 月份:`, months, '| 人數:', people.length);
            return { months, people };
        }

        function processRejectSheet(sheet) {
            const { months, people } = processCompanyPersonSheet(sheet, '❌ [申請人被駁回]');
            return { months, applicants: people };
        }

        function processManagerRejectSheet(sheet) {
            const { months, people } = processCompanyPersonSheet(sheet, '⚠️ [主管駁回]');
            return { months, managers: people };
        }

        function processApprovalTimeSheet(sheet) {
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

            // 第一段: 流程超過10關的表單 (從"表單號碼"標題行之後,到第二段標題為止,筆數不固定)
            let over10HeaderIdx = -1;
            let secondSectionIdx = json.length;
            for (let i = 0; i < json.length; i++) {
                const firstCol = cellText(json[i] && json[i][0]);
                if (over10HeaderIdx === -1 && firstCol === '表單號碼') {
                    over10HeaderIdx = i;
                    continue;
                }
                if (over10HeaderIdx > -1 && firstCol.includes('簽核時間統計')) {
                    secondSectionIdx = i;
                    break;
                }
            }

            const over10Forms = [];
            if (over10HeaderIdx > -1) {
                for (let i = over10HeaderIdx + 1; i < secondSectionIdx; i++) {
                    const row = json[i];
                    if (!row || !cellText(row[0])) continue;
                    const steps = toNum(row[4]);
                    if (steps <= 0) continue;
                    over10Forms.push({
                        form_no: cellText(row[0]),
                        subject: cellText(row[1]),
                        dept: cellText(row[2]),
                        applicant: cellText(row[3]),
                        steps: steps
                    });
                }
            }

            // 第二段: 各關卡簽核時間 (從"流程順序"標題行之後開始)
            let recordsStartIdx = secondSectionIdx + 4;
            for (let i = secondSectionIdx; i < json.length; i++) {
                if (cellText(json[i] && json[i][2]) === '流程順序') {
                    recordsStartIdx = i + 1;
                    break;
                }
            }

            const approvalRecords = [];
            let currentForm = '';
            let currentSubject = '';

            for (let i = recordsStartIdx; i < json.length; i++) {
                const row = json[i];
                if (!row) continue;

                if (row[0]) {
                    currentForm = String(row[0]);
                    currentSubject = String(row[1] || '');
                }

                if (row[2]) {
                    const normalMins = calculateMinutes(row[5], row[6], row[7]);
                    const ccMins = calculateMinutes(row[8], row[9], row[10]);

                    approvalRecords.push({
                        form_no: currentForm,
                        subject: currentSubject,
                        sequence: String(row[2]),
                        company: String(row[3] || ''),
                        manager: String(row[4] || ''),
                        normal_mins: normalMins,
                        cc_mins: ccMins,
                        total_mins: normalMins + ccMins
                    });
                }
            }

            const formStats = {};
            const managerStats = {};
            const companyStats = {};

            approvalRecords.forEach(record => {
                if (record.form_no) {
                    if (!formStats[record.form_no]) {
                        formStats[record.form_no] = {
                            subject: record.subject || '',
                            total_steps: 0,
                            total_time_mins: 0,
                            max_step_time: 0
                        };
                    }
                    const formStat = formStats[record.form_no];
                    formStat.total_steps += 1;
                    formStat.total_time_mins += record.total_mins;
                    if (record.total_mins > formStat.max_step_time) {
                        formStat.max_step_time = record.total_mins;
                    }
                }

                if (record.manager) {
                    if (!managerStats[record.manager]) {
                        managerStats[record.manager] = { total_mins: 0, count: 0 };
                    }
                    managerStats[record.manager].total_mins += record.total_mins;
                    managerStats[record.manager].count += 1;
                }

                if (record.company) {
                    if (!companyStats[record.company]) {
                        companyStats[record.company] = { total_mins: 0, count: 0 };
                    }
                    companyStats[record.company].total_mins += record.total_mins;
                    companyStats[record.company].count += 1;
                }
            });

            Object.values(formStats).forEach(stat => {
                stat.avg_time_mins = stat.total_steps > 0 ? stat.total_time_mins / stat.total_steps : 0;
            });

            Object.values(managerStats).forEach(stat => {
                stat.avg_mins = stat.count > 0 ? stat.total_mins / stat.count : 0;
                stat.avg_hours = stat.avg_mins / 60;
            });

            Object.values(companyStats).forEach(stat => {
                stat.avg_mins = stat.count > 0 ? stat.total_mins / stat.count : 0;
                stat.avg_hours = stat.avg_mins / 60;
            });

            return {
                over_10_forms: over10Forms,
                approval_records: approvalRecords,
                form_stats: formStats,
                manager_stats: managerStats,
                company_stats: companyStats
            };
        }

        function calculateMinutes(days, hours, mins) {
            let total = 0;
            if (days && days !== '-') total += Number(days) * 24 * 60;
            if (hours && hours !== '-') total += Number(hours) * 60;
            if (mins && mins !== '-') total += Number(mins);
            return total;
        }

        // ============== 歷史分析報表清單 ==============
        function renderHistoryList() {
            const card = document.getElementById('historyCard');
            const list = document.getElementById('historyList');
            const index = bpmGetHistoryIndex();
            if (!index.length) {
                card.style.display = 'none';
                return;
            }
            card.style.display = 'block';
            list.innerHTML = index.map(e => {
                const saved = e.savedAt ? new Date(e.savedAt).toLocaleString('zh-TW') : '';
                return `
                    <div class="history-item">
                        <span class="history-month">${bpmFormatMonth(e.month)}</span>
                        <span class="history-meta">${e.fileName || '—'}${saved ? ' · 保存於 ' + saved : ''}</span>
                        <button class="history-open" onclick="openHistory('${e.month}')">開啟報表</button>
                        <button class="history-delete" onclick="deleteHistoryEntry('${e.month}')">刪除</button>
                    </div>
                `;
            }).join('');
        }

        function openHistory(month) {
            const data = bpmLoadHistory(month);
            if (!data) {
                showError('讀取歷史資料失敗,該月份資料可能已損毀');
                return;
            }
            const entry = bpmGetHistoryIndex().find(e => e.month === month);
            sessionStorage.setItem('bpmAnalysisData', JSON.stringify(data));
            sessionStorage.setItem('uploadedFileName', (entry && entry.fileName) || `歷史報表 ${bpmFormatMonth(month)}`);
            window.location.href = 'results.html';
        }

        function deleteHistoryEntry(month) {
            if (!confirm(`確定刪除 ${bpmFormatMonth(month)} 的歷史分析資料?`)) return;
            bpmDeleteHistory(month);
            renderHistoryList();
        }

        renderHistoryList();

        // 頁面加載完成時的測試日誌
        console.log('✅ ========================================');
        console.log('✅ index.html 已成功加載!');
        console.log('✅ Console 正常運作');
        console.log('✅ 請選擇並上傳 Excel 文件');
        console.log('✅ ========================================');
    </script>
